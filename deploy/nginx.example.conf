# Ejemplo para servidor propio (nginx). Ajusta server_name, rutas y certificados.
server {
    listen 80;
    server_name saltylyrics.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name saltylyrics.example.com;

    ssl_certificate     /etc/letsencrypt/live/saltylyrics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saltylyrics.example.com/privkey.pem;

    root  /var/www/saltylyrics;   # raíz del repo (index.html + spicy-renderer/dist/)
    index index.html;

    gzip on;
    gzip_types text/css application/javascript;

    # index.html: siempre se revalida (así el ?v= nuevo se descubre al instante)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # js y css del bundle: caché larga, protegidos por ?v=<hash>
    location ~* ^/spicy-renderer/dist/[^/]+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # fuentes: nombre estable (sin ?v=), así que caché larga pero no immutable
    location ~* ^/spicy-renderer/dist/assets/.+\.woff2$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
    }
}
